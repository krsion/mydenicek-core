name: Scheduled Spinup

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  spinup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [sync, docs-api, acl, attachments]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy service
        run: az deployment sub create --location westeurope --template-file infra/services/${{ matrix.service }}/main.bicep --parameters acrLoginServer=acrplaceholder.azurecr.io imageTag=latest
