name: Destroy All Resources

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: 'Type DESTROY to confirm deletion of all resource groups'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  check-confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ inputs.CONFIRM }}" != "DESTROY" ]; then
            echo "❌ Confirmation failed. You must type exactly 'DESTROY' to proceed."
            exit 1
          fi
          echo "✅ Confirmation accepted. Proceeding with destruction."

  destroy:
    needs: check-confirmation
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete all resource groups
        run: |
          echo "Listing all resource groups..."
          GROUPS=$(az group list --query "[].name" -o tsv)
          if [ -z "$GROUPS" ]; then
            echo "No resource groups found."
            exit 0
          fi
          echo "Deleting resource groups:"
          echo "$GROUPS"
          while IFS= read -r rg; do
            echo "Deleting: $rg"
            az group delete --name "$rg" --yes --no-wait
          done <<< "$GROUPS"
          echo "Deletion requests submitted (running in background)."
