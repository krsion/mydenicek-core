name: Deploy Service

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        type: choice
        options:
          - sync
          - docs-api
          - acl
          - attachments
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: Docker image tag (defaults to git SHA)
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve ACR name
        id: acr
        run: |
          ACR_NAME=$(az acr list --query "[0].name" -o tsv)
          echo "name=${ACR_NAME}" >> "$GITHUB_OUTPUT"
          echo "loginServer=${ACR_NAME}.azurecr.io" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        run: az acr login --name ${{ steps.acr.outputs.name }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ steps.acr.outputs.loginServer }}/${{ inputs.service }}:${{ env.IMAGE_TAG }}"
          docker build -t "$IMAGE" apps/${{ inputs.service }}/
          docker push "$IMAGE"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy service Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP_SHARED }}
          template: infra/services/${{ inputs.service }}/main.bicep
          parameters: >
            infra/envs/${{ inputs.environment }}.bicepparam
            imageTag=${{ env.IMAGE_TAG }}
          deploymentName: ${{ inputs.service }}-${{ github.run_number }}
